<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8576b7"/></marker></defs><rect width="1400" height="960" fill="#faf9fe"/><text x="50" y="55" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#211938">Bank data to proactive brief</text><text x="50" y="90" font-family="DejaVu Sans" font-size="16" fill="#686078">Observed data, inferred categories and calculated facts remain distinct.</text><path d="M 570 210.0 H 690.0 V 210.0 H 810" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1060.0 270 V 340.0 H 1060.0 V 410" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 810 480.0 H 690.0 V 480.0 H 570" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 320.0 550 V 625.0 H 320.0 V 700" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 570 767.5 H 690.0 V 767.5 H 810" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="150" width="500" height="120" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="70" y="150" width="500" height="42" rx="12" fill="#ede6ff"/><text x="88" y="178" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">1. Import complete sync update</text><text x="88" y="217" font-family="DejaVu Sans" font-size="15" fill="#393246">Synthetic added / modified / removed</text><text x="88" y="240" font-family="DejaVu Sans" font-size="15" fill="#393246">Validate records; commit cursor atomically</text><rect x="810" y="150" width="500" height="120" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="810" y="150" width="500" height="42" rx="12" fill="#ede6ff"/><text x="828" y="178" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">2. Normalize and reconcile</text><text x="828" y="217" font-family="DejaVu Sans" font-size="15" fill="#393246">Integer money; posted versus pending</text><text x="828" y="240" font-family="DejaVu Sans" font-size="15" fill="#393246">Deduplicate and preserve raw lineage</text><rect x="810" y="410" width="500" height="140" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="810" y="410" width="500" height="42" rx="12" fill="#ede6ff"/><text x="828" y="438" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">3. Classify with context</text><text x="828" y="477" font-family="DejaVu Sans" font-size="15" fill="#393246">Rules for clear cases; AI for ambiguity</text><text x="828" y="500" font-family="DejaVu Sans" font-size="15" fill="#393246">Validate categories and source references</text><text x="828" y="523" font-family="DejaVu Sans" font-size="15" fill="#393246">Retain unresolved status when needed</text><rect x="70" y="410" width="500" height="140" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="70" y="410" width="500" height="42" rx="12" fill="#ede6ff"/><text x="88" y="438" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">4. Calculate financial snapshot</text><text x="88" y="477" font-family="DejaVu Sans" font-size="15" fill="#393246">Apply visitor-specific owner corrections</text><text x="88" y="500" font-family="DejaVu Sans" font-size="15" fill="#393246">Compute metrics and comparable periods</text><text x="88" y="523" font-family="DejaVu Sans" font-size="15" fill="#393246">Attach input and calculation versions</text><rect x="70" y="700" width="500" height="135" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="70" y="700" width="500" height="42" rx="12" fill="#ede6ff"/><text x="88" y="728" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">5. Generate proactive brief</text><text x="88" y="767" font-family="DejaVu Sans" font-size="15" fill="#393246">AI explains measured changes</text><text x="88" y="790" font-family="DejaVu Sans" font-size="15" fill="#393246">Ask for missing context; cite evidence</text><rect x="810" y="700" width="500" height="135" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="810" y="700" width="500" height="42" rx="12" fill="#ede6ff"/><text x="828" y="728" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">6. Publish to overview</text><text x="828" y="767" font-family="DejaVu Sans" font-size="15" fill="#393246">Validate claims before display</text><text x="828" y="790" font-family="DejaVu Sans" font-size="15" fill="#393246">Refresh or mark stale after input changes</text><text x="50" y="936" font-family="DejaVu Sans" font-size="13" fill="#81778e">AI CFO · Independent prototype · Proposed architecture · September 2026</text></svg>