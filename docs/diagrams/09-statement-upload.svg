<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8576b7"/></marker></defs><rect width="1400" height="1050" fill="#faf9fe"/><text x="50" y="55" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#211938">CashLens: statement upload workflow</text><text x="50" y="90" font-family="DejaVu Sans" font-size="16" fill="#686078">CSV and supported text PDFs; review extracted information before analysis.</text><path d="M 600 220.0 H 700.0 V 220.0 H 800" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1070.0 290 V 370.0 H 1070.0 V 450" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 800 527.5 H 700.0 V 527.5 H 600" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 330.0 605 V 692.5 H 330.0 V 780" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 600 850.0 H 700.0 V 850.0 H 800" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="150" width="540" height="140" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="60" y="150" width="540" height="42" rx="12" fill="#ede6ff"/><text x="78" y="178" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">1. Authenticate and upload</text><text x="78" y="217" font-family="DejaVu Sans" font-size="15" fill="#393246">Private business and account scope</text><text x="78" y="240" font-family="DejaVu Sans" font-size="15" fill="#393246">Validate type, size, pages and quota</text><rect x="800" y="150" width="540" height="140" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="800" y="150" width="540" height="42" rx="12" fill="#ede6ff"/><text x="818" y="178" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">2. Extract draft transactions</text><text x="818" y="217" font-family="DejaVu Sans" font-size="15" fill="#393246">CSV mapping or PDF text extraction</text><text x="818" y="240" font-family="DejaVu Sans" font-size="15" fill="#393246">Bounded AI assistance with source evidence</text><rect x="800" y="450" width="540" height="155" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="800" y="450" width="540" height="42" rx="12" fill="#ede6ff"/><text x="818" y="478" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">3. Validate and reconcile</text><text x="818" y="517" font-family="DejaVu Sans" font-size="15" fill="#393246">Dates, signs, currency and statement period</text><text x="818" y="540" font-family="DejaVu Sans" font-size="15" fill="#393246">Compare totals where available</text><text x="818" y="563" font-family="DejaVu Sans" font-size="15" fill="#393246">Flag missing or uncertain information</text><rect x="60" y="450" width="540" height="155" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="60" y="450" width="540" height="42" rx="12" fill="#ede6ff"/><text x="78" y="478" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">4. Owner review</text><text x="78" y="517" font-family="DejaVu Sans" font-size="15" fill="#393246">Correct rows and confirm account</text><text x="78" y="540" font-family="DejaVu Sans" font-size="15" fill="#393246">Resolve potential duplicates</text><text x="78" y="563" font-family="DejaVu Sans" font-size="15" fill="#393246">Unsupported files return a clear explanation</text><rect x="60" y="780" width="540" height="140" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="60" y="780" width="540" height="42" rx="12" fill="#ede6ff"/><text x="78" y="808" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">5. Confirm import atomically</text><text x="78" y="847" font-family="DejaVu Sans" font-size="15" fill="#393246">Check reviewed revision and idempotency</text><text x="78" y="870" font-family="DejaVu Sans" font-size="15" fill="#393246">Preserve provenance; no partial publication</text><rect x="800" y="780" width="540" height="140" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="800" y="780" width="540" height="42" rx="12" fill="#ede6ff"/><text x="818" y="808" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">6. Run the shared analysis</text><text x="818" y="847" font-family="DejaVu Sans" font-size="15" fill="#393246">Fresh classifications, metrics and briefs</text><text x="818" y="870" font-family="DejaVu Sans" font-size="15" fill="#393246">Dated balances and labeled projections</text><text x="50" y="1026" font-family="DejaVu Sans" font-size="13" fill="#81778e">CashLens · Independent prototype · Proposed architecture · September 2026</text></svg>