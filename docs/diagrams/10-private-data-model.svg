<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8576b7"/></marker></defs><rect width="1400" height="1360" fill="#faf9fe"/><text x="50" y="55" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#211938">CashLens: private import database relationships</text><text x="50" y="90" font-family="DejaVu Sans" font-size="16" fill="#686078">PK = primary key; FK = foreign key. Arrows are parent to zero-or-many children.</text><path d="M 600 202.5 H 700.0 V 202.5 H 800" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1070.0 410 V 337.5 H 1070.0 V 265" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 800 472.5 H 700.0 V 487.5 H 600" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 330.0 565 V 662.5 H 330.0 V 760" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1070.0 535 V 647.5 H 1070.0 V 760" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 330.0 915 V 1002.5 H 330.0 V 1090" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1070.0 915 V 1002.5 H 1070.0 V 1090" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M 800 1167.5 H 700.0 V 1167.5 H 600" fill="none" stroke="#8576b7" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="140" width="540" height="125" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="60" y="140" width="540" height="42" rx="12" fill="#ede6ff"/><text x="78" y="168" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">auth.users</text><text x="78" y="207" font-family="DejaVu Sans" font-size="15" fill="#393246">PK id</text><text x="78" y="230" font-family="DejaVu Sans" font-size="15" fill="#393246">Authenticated owner identity</text><rect x="800" y="140" width="540" height="125" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="800" y="140" width="540" height="42" rx="12" fill="#ede6ff"/><text x="818" y="168" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">business_memberships</text><text x="818" y="207" font-family="DejaVu Sans" font-size="15" fill="#393246">PK / FK business_id + user_id</text><text x="818" y="230" font-family="DejaVu Sans" font-size="15" fill="#393246">Membership authorizes private business access</text><rect x="800" y="410" width="540" height="125" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="800" y="410" width="540" height="42" rx="12" fill="#ede6ff"/><text x="818" y="438" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">businesses</text><text x="818" y="477" font-family="DejaVu Sans" font-size="15" fill="#393246">PK id; data_mode = demo or private</text><text x="818" y="500" font-family="DejaVu Sans" font-size="15" fill="#393246">Business scope enforced on linked records</text><rect x="60" y="410" width="540" height="155" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="60" y="410" width="540" height="42" rx="12" fill="#ede6ff"/><text x="78" y="438" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">document_imports</text><text x="78" y="477" font-family="DejaVu Sans" font-size="15" fill="#393246">PK id; FK business_id, uploaded_by</text><text x="78" y="500" font-family="DejaVu Sans" font-size="15" fill="#393246">Object path, hash, format, draft_revision</text><text x="78" y="523" font-family="DejaVu Sans" font-size="15" fill="#393246">Status, confirmation and expiration</text><rect x="60" y="760" width="540" height="155" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="60" y="760" width="540" height="42" rx="12" fill="#ede6ff"/><text x="78" y="788" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">import_rows</text><text x="78" y="827" font-family="DejaVu Sans" font-size="15" fill="#393246">PK id; FK import_id</text><text x="78" y="850" font-family="DejaVu Sans" font-size="15" fill="#393246">Source page / row; extracted and reviewed fields</text><text x="78" y="873" font-family="DejaVu Sans" font-size="15" fill="#393246">Validation flags; unique import / row index</text><rect x="800" y="760" width="540" height="155" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="800" y="760" width="540" height="42" rx="12" fill="#ede6ff"/><text x="818" y="788" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">accounts</text><text x="818" y="827" font-family="DejaVu Sans" font-size="15" fill="#393246">PK id; FK business_id</text><text x="818" y="850" font-family="DejaVu Sans" font-size="15" fill="#393246">Source type; optional connection_id</text><text x="818" y="873" font-family="DejaVu Sans" font-size="15" fill="#393246">Account identity confirmed by owner</text><rect x="60" y="1090" width="540" height="155" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="60" y="1090" width="540" height="42" rx="12" fill="#ede6ff"/><text x="78" y="1118" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">transaction_sources</text><text x="78" y="1157" font-family="DejaVu Sans" font-size="15" fill="#393246">PK id; FK transaction_id</text><text x="78" y="1180" font-family="DejaVu Sans" font-size="15" fill="#393246">FK import_row_id OR raw_event_id</text><text x="78" y="1203" font-family="DejaVu Sans" font-size="15" fill="#393246">Multiple sources may support one transaction</text><rect x="800" y="1090" width="540" height="155" rx="12" fill="white" stroke="#b9a5f2" stroke-width="1.5"/><rect x="800" y="1090" width="540" height="42" rx="12" fill="#ede6ff"/><text x="818" y="1118" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#43218c">transactions</text><text x="818" y="1157" font-family="DejaVu Sans" font-size="15" fill="#393246">PK id; FK account_id, business_id</text><text x="818" y="1180" font-family="DejaVu Sans" font-size="15" fill="#393246">Signed minor units, date, source, revision</text><text x="818" y="1203" font-family="DejaVu Sans" font-size="15" fill="#393246">Provider external_id nullable for uploads</text><text x="50" y="1336" font-family="DejaVu Sans" font-size="13" fill="#81778e">CashLens · Independent prototype · Proposed architecture · September 2026</text></svg>