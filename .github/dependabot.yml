# Dependabot: weekly version updates and security alerts for the three ecosystems here.
# Security updates are opened as soon as an advisory lands, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
